services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-costura_optima}
      POSTGRES_USER: ${POSTGRES_USER:-costura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-costura}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-costura} -d ${POSTGRES_DB:-costura_optima}"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://costura:costura@db:5432/costura_optima}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: >-
      sh -c "alembic upgrade head && python -m costura_optima.infrastructure.seed && python -m costura_optima.patterns.generate && uvicorn costura_optima.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://costura:costura@db:5432/costura_optima}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: >-
      sh -c "python -m costura_optima.worker.recovery && rq worker optimization --url redis://redis:6379/0 --with-scheduler"
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  redis_data:
