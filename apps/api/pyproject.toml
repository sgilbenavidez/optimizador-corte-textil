[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "costura-optima-api"
version = "0.1.0"
description = "Foundation API for Costura Optima"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "pyclipper>=1.4,<2",
  "ortools>=9.14,<10",
  "redis>=6,<8",
  "rq>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "shapely>=2.1,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/costura_optima"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
